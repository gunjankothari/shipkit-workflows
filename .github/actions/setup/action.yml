# Shared setup steps used by both the iOS and Android build jobs.
name: ShipKit build setup
description: Checks out the app and ShipKit tools, installs Node.js, and prepares the project.

inputs:
  platform:
    description: ios or android
    required: true
  env_file:
    description: Contents of SHIPKIT_ENV_FILE (passed from the calling job's secret)
    required: false

runs:
  using: composite
  steps:
    - name: Get your app's code
      uses: actions/checkout@v5

    - name: Get the ShipKit build scripts
      uses: actions/checkout@v5
      with:
        repository: gunjankothari/shipkit-workflows
        ref: v1
        path: .shipkit-tools

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: Install packages and prepare the project
      env:
        SHIPKIT_ENV_FILE: ${{ inputs.env_file }}
      shell: bash
      run: node "$SHIPKIT_TOOLS/prepare-project.mjs" ${{ inputs.platform }}
