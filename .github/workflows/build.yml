# ShipKit shared build workflow.
# Users' repositories call this from the one small file ShipKit adds to them.
# It builds and signs the app, then either uploads it to the store or leaves the signed
# build as a short-lived artifact for the ShipKit desktop app to upload.
name: ShipKit shared build

on:
  workflow_call:
    inputs:
      build_id:
        type: string
        required: true
      platform:
        type: string
        required: true
        # ios, android, or both
      build_number:
        type: string
        required: true
      # Separate build numbers for each platform when platform is 'both'.
      # When omitted, build_number is used for both.
      ios_build_number:
        type: string
        required: false
      android_build_number:
        type: string
        required: false
      upload:
        type: string
        required: true
      config:
        type: string
        required: true
      tag:
        type: string
        required: false
        # When set, a GitHub Release is created with this tag and the build files attached.
      release_notes:
        type: string
        required: false
    secrets:
      SHIPKIT_ENV_FILE:
        required: false
      SHIPKIT_IOS_P12_BASE64:
        required: false
      SHIPKIT_IOS_P12_PASSWORD:
        required: false
      SHIPKIT_IOS_PROFILE_BASE64:
        required: false
      SHIPKIT_ASC_KEY_ID:
        required: false
      SHIPKIT_ASC_ISSUER_ID:
        required: false
      SHIPKIT_ASC_KEY_P8:
        required: false
      SHIPKIT_ANDROID_KEYSTORE_BASE64:
        required: false
      SHIPKIT_ANDROID_STORE_PASSWORD:
        required: false
      SHIPKIT_ANDROID_KEY_ALIAS:
        required: false
      SHIPKIT_ANDROID_KEY_PASSWORD:
        required: false
      SHIPKIT_GOOGLE_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

env:
  # Inputs reach scripts through the environment, never by being pasted into a command.
  SHIPKIT_CONFIG: ${{ inputs.config }}
  SHIPKIT_BUILD_ID: ${{ inputs.build_id }}
  SHIPKIT_UPLOAD: ${{ inputs.upload }}
  SHIPKIT_TOOLS: ${{ github.workspace }}/.shipkit-tools/scripts

jobs:
  ios:
    name: Build for iPhone
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SHIPKIT_BUILD_NUMBER: ${{ inputs.ios_build_number || inputs.build_number }}
    steps:
      - name: Set up the project
        uses: gunjankothari/shipkit-workflows/.github/actions/setup@v1
        with:
          platform: ios
          env_file: ${{ secrets.SHIPKIT_ENV_FILE }}

      # App Store Connect requires the iOS 27 SDK (Xcode 27+) from April 2027 (ITMS-90725).
      - name: Select Xcode 27
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::Xcode 27 is not installed on this runner. Available:" && ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install iPhone libraries
        run: cd "$SHIPKIT_PROJECT_DIR/ios" && pod install

      - name: Put the signing certificate in a temporary keychain
        env:
          P12_BASE64: ${{ secrets.SHIPKIT_IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SHIPKIT_IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/shipkit.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "SHIPKIT_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install the provisioning profiles
        env:
          SHIPKIT_IOS_PROFILE_BASE64: ${{ secrets.SHIPKIT_IOS_PROFILE_BASE64 }}
        run: node "$SHIPKIT_TOOLS/install-profiles.mjs"

      - name: Apply signing and the build number
        id: prepare
        run: node "$SHIPKIT_TOOLS/prepare-ios.mjs"

      - name: Build the app
        env:
          WORKSPACE: ${{ steps.prepare.outputs.workspace }}
          SCHEME: ${{ steps.prepare.outputs.scheme }}
        run: |
          set -euo pipefail
          cd "$SHIPKIT_PROJECT_DIR"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            "OTHER_CODE_SIGN_FLAGS=--keychain $SHIPKIT_KEYCHAIN"

      - name: Package the build for the App Store
        run: |
          set -euo pipefail
          cd "$SHIPKIT_PROJECT_DIR"
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/export -exportOptionsPlist build/ExportOptions.plist
          echo "SHIPKIT_IPA=$(ls "$PWD"/build/export/*.ipa | head -1)" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        id: store
        if: inputs.upload == 'github'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.SHIPKIT_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.SHIPKIT_ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.SHIPKIT_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_KEY_P8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc-keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_KEY_P8" > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$SHIPKIT_IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # When the store upload did not happen here, the signed build is kept briefly so the
      # ShipKit desktop app can download it, upload it, and then delete it.
      - name: Keep the signed build for ShipKit to upload
        if: inputs.upload != 'github' || steps.store.outcome != 'success'
        uses: actions/upload-artifact@v5
        with:
          name: shipkit-build-${{ inputs.build_id }}${{ inputs.platform == 'both' && '-ios' || '' }}
          path: ${{ env.SHIPKIT_IPA }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload IPA for release
        if: inputs.tag != ''
        uses: actions/upload-artifact@v5
        with:
          name: shipkit-release-ipa-${{ inputs.build_id }}
          path: ${{ env.SHIPKIT_IPA }}
          retention-days: 1
          if-no-files-found: error

      - name: Delete the temporary keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/shipkit.keychain-db" || true
          rm -rf "$RUNNER_TEMP/asc-keys" "${SHIPKIT_PROJECT_DIR:-.}/.env"

  android:
    name: Build for Android
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHIPKIT_BUILD_NUMBER: ${{ inputs.android_build_number || inputs.build_number }}
    steps:
      # GitHub's Linux machines come with many tools an app build never uses. A React Native build
      # needs the room, and runs out of disk space without this.
      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/google-cloud-sdk /opt/az /opt/microsoft || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
          # Compiling native code (for example Reanimated) for four processor types at once can use
          # more memory than the machine has; extra swap keeps the machine from being shut down.
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile-shipkit
          sudo chmod 600 /swapfile-shipkit
          sudo mkswap /swapfile-shipkit > /dev/null
          sudo swapon /swapfile-shipkit
          free -m

      - name: Set up the project
        uses: gunjankothari/shipkit-workflows/.github/actions/setup@v1
        with:
          platform: android
          env_file: ${{ secrets.SHIPKIT_ENV_FILE }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Apply the build number
        run: node "$SHIPKIT_TOOLS/prepare-android.mjs"

      - name: Build and sign the app
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIPKIT_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHIPKIT_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIPKIT_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIPKIT_ANDROID_KEY_PASSWORD }}
          SHIPKIT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd "$SHIPKIT_PROJECT_DIR/android"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          chmod +x ./gradlew
          df -h / | tail -1
          # Log free disk and memory while building, so a machine that runs out shows which one.
          ( while sleep 30; do echo "[resources] disk: $(df -h / | awk 'NR==2 {print $4 " free"}'), memory: $(free -m | awk '/^Mem:/ {print $7 " MB available"}'), swap used: $(free -m | awk '/^Swap:/ {print $3 " MB"}')"; done ) &
          monitor=$!
          trap 'kill $monitor 2>/dev/null || true' EXIT
          TASKS="bundleRelease${SHIPKIT_TAG:+ assembleRelease}"
          ./gradlew $TASKS --no-daemon --max-workers=2 \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.keystore" \
            "-Pandroid.injected.signing.store.password=$STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          echo "SHIPKIT_AAB_PATH=$SHIPKIT_PROJECT_DIR/android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
          echo "SHIPKIT_APK_PATH=$SHIPKIT_PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Upload to Google Play
        id: store
        if: inputs.upload == 'github'
        continue-on-error: true
        env:
          SHIPKIT_GOOGLE_ACCESS_TOKEN: ${{ secrets.SHIPKIT_GOOGLE_ACCESS_TOKEN }}
        run: node "$SHIPKIT_TOOLS/upload-play.mjs"

      - name: Keep the signed build for ShipKit to upload
        if: inputs.upload != 'github' || steps.store.outcome != 'success'
        uses: actions/upload-artifact@v5
        with:
          name: shipkit-build-${{ inputs.build_id }}${{ inputs.platform == 'both' && '-android' || '' }}
          path: ${{ env.SHIPKIT_AAB_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload AAB and APK for release
        if: inputs.tag != ''
        uses: actions/upload-artifact@v5
        with:
          name: shipkit-release-android-${{ inputs.build_id }}
          path: |
            ${{ env.SHIPKIT_AAB_PATH }}
            ${{ env.SHIPKIT_APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" "${SHIPKIT_PROJECT_DIR:-.}/.env"

  release:
    name: Create GitHub Release
    needs: [ios, android]
    # Run when a tag was requested and at least one platform built successfully.
    # 'skipped' means that platform was not in scope; treat it the same as success.
    if: >
      always() &&
      inputs.tag != '' &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPA
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: shipkit-release-ipa-${{ inputs.build_id }}
          path: release-files

      - name: Download AAB and APK
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: shipkit-release-android-${{ inputs.build_id }}
          path: release-files

      - name: Create release with build files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.release_notes }}
          # Tag the commit that was built: the chosen branch, or the commit the build started on.
          TARGET: ${{ fromJSON(inputs.config).ref || github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTES" > /tmp/notes.md
          FILES=$(find release-files -type f | sort | tr '\n' ' ')
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$TARGET" \
            --notes-file /tmp/notes.md \
            $FILES
